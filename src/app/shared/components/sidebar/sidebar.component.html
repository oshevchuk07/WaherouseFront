<aside [@sidebarWidth]="isCollapsed() ? 'collapsed' : 'expanded'" class="h-screen bg-gray-900 flex flex-col overflow-hidden shrink-0
             border-r border-gray-800">
  <!-- Logo -->
  <div class="flex items-center gap-3 px-4 py-5 border-b border-gray-800 shrink-0">
    <app-icon name="logo" [size]="28" cssClass="text-blue-400 shrink-0" />
    @if (!isCollapsed()) {
    <div class="leading-tight overflow-hidden">
      <div class="font-bold text-white text-sm whitespace-nowrap">WAREHOUSE</div>
      <div class="text-blue-400 font-normal text-xs tracking-widest">PLATFORM</div>
    </div>
    }
  </div>

  <!-- Nav -->
  <nav class="flex-1 overflow-y-auto overflow-x-hidden px-2 py-4 flex flex-col gap-0.5">
    @for (entry of visibleEntries(); track $index) {

    @if (entry.type === 'divider') {
    <!-- Divider -->
    @if (!isCollapsed()) {
    <div class="mx-2 mt-3 mb-1">
      @if (asDivider(entry).label) {
      <span class="text-xs font-medium text-gray-500 uppercase tracking-widest px-1">
        {{ asDivider(entry).label }}
      </span>
      } @else {
      <hr class="border-gray-700" />
      }
    </div>
    } @else {
    <hr class="border-gray-700 mx-2 my-2" />
    }
    }

    @if (entry.type === 'item') {
    <app-sidebar-nav-item [item]="asItem(entry)" [expanded]="!isCollapsed()" />
    }

    }
  </nav>

  <!-- Footer -->
  <div class="border-t border-gray-800 px-2 py-3 flex flex-col gap-1 shrink-0">
    <button (click)="logout.emit()" class="nav-item w-full hover:!bg-red-900/40 hover:!text-red-400"
      [class.nav-item--collapsed]="isCollapsed()">
      <app-icon name="logout" [size]="20" cssClass="shrink-0" />
      @if (!isCollapsed()) {
      <span class="nav-item__label">Cerrar sesión</span>
      }
    </button>

    <button (click)="toggleExpanded()" class="flex items-center justify-center py-2 rounded-lg text-gray-500
                 hover:bg-gray-700 hover:text-white transition-colors w-full">
      <app-icon name="chevron-left" [size]="18" cssClass="transition-transform duration-250"
        [class.rotate-180]="isCollapsed()" />
    </button>
  </div>
</aside>
