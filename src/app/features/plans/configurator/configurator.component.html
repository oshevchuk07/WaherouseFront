<div class="flex flex-col gap-6">
  <section>
    <div class="flex items-start justify-between gap-4">
      <div class="flex flex-col gap-1">
        <h1 class="text-2xl font-semibold text-gray-800 dark:text-gray-100">Subscription configurator</h1>
        <p class="text-sm text-gray-500 dark:text-gray-400">
          Create, manage and fine-tune your pricing plans, and billing cycles in one place.
        </p>
      </div>
      <button class="ui-btn-primary shrink-0" (click)="addNewPlan()">
        <span class="material-icons text-base">add</span>
        Add new subscription
      </button>
    </div>
  </section>

  <div class="flex gap-4 justify-center flex-wrap">
    @if (plansStore.planListLoading()) {
      Loading
    } @else {
      @for (plan of plansStore.planList(); track plan.id) {
        <app-plan-cart [item]="plan" [editMode]="true" (editItem)="editPlanItem($event)"></app-plan-cart>
      }
    }
  </div>
</div>
