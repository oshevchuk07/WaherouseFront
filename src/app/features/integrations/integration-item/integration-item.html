<div class="flex items-center gap-4">
  <div class="w-[60px]">
    @if (item().isActive) {
      <div class="w-[20px] mx-auto">
        <app-icon name="active_check" />
      </div>
    } @else {
      <div class="w-[20px] mx-auto">
        <app-icon name="inactive_check" />
      </div>
    }
  </div>
  <div class="w-[200px] flex flex-col">
    <div class="text-gray-500 font-[500] text-[16px] cursor-pointer underline" (click)="openExternalLink()" role="button" tabindex="0">
      {{ item().name }}
    </div>
  </div>
  <div class="flex-1 flex">
    {{ item().description }}
  </div>
  <div class="mr-8">
    @if (item().logoImage) {
      <img [src]="item().logoImage" [alt]="item().name + ' logo'" class="h-8" />
    }
  </div>
  <div class="w-[20]">
    <button dash-icon-button dash-transparent matRipple (click)="editService()">
      <span class="material-icons text-lg">edit</span>
    </button>
  </div>
</div>
