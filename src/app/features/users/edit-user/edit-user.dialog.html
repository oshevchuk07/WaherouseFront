<div class="ui-dialog">
  <div class="ui-dialog__header">
    <h2 class="ui-dialog__title">Edit user</h2>
    <button class="ui-dialog__close" (click)="cancel()" aria-label="Close dialog">
      <app-icon name="close_ring_light" [size]="32" />
    </button>
  </div>

  <div class="ui-dialog__body flex flex-col gap-4" [formGroup]="editForm">
    <div class="flex gap-3">
      <app-form-field label="First name" class="flex-1" [error]="getFieldError('firstName')">
        <input class="ui-input" type="text" placeholder="First name" formControlName="firstName" />
      </app-form-field>

      <app-form-field label="Last name" class="flex-1" [error]="getFieldError('lastName')">
        <input class="ui-input" type="text" placeholder="Last name" formControlName="lastName" />
      </app-form-field>
    </div>

    <app-form-field label="Email" [error]="getFieldError('email')">
      <input class="ui-input" type="email" placeholder="user@example.com" formControlName="email" />
    </app-form-field>

    <app-form-field label="Plan">
      <select class="ui-select" formControlName="planId">
        <option value="">— No plan —</option>
        @for (plan of plans(); track plan.id) {
          <option [value]="plan.id">{{ plan.name }}</option>
        }
      </select>
    </app-form-field>
  </div>

  <div class="ui-dialog__footer">
    <button class="ui-btn-secondary" (click)="cancel()">Cancel</button>
    <button class="ui-btn-primary" [disabled]="saving()" (click)="save()">
      @if (saving()) {
        <span class="material-icons text-base animate-spin">refresh</span>
        Saving...
      } @else {
        Save
      }
    </button>
  </div>
</div>
