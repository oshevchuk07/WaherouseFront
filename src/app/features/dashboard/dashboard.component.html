<div class="flex flex-col gap-2">
  <h1 class="text-2xl font-semibold text-gray-800">Home</h1>
  <p class="text-gray-500 text-sm">Dashboard — en construcción</p>
  <button (click)="submit()">Sucess</button>

  <p>
    <app-icon name="Add_light" />
  </p>
  <hr>
  <!-- Простий інпут -->
  <app-form-field label="Email" [error]="'wer'">
    <input class="ui-input" type="email"/>
  </app-form-field>

  <!-- Textarea -->
  <app-form-field label="Опис" hint="Не більше 500 символів">
    <textarea class="ui-textarea" rows="4" ></textarea>
  </app-form-field>

  <!-- Select -->
  <app-form-field label="Роль">
    <select class="ui-select" >
      <option value="USER">User</option>
      <option value="ADMIN">Admin</option>
    </select>
  </app-form-field>

  <!-- Кнопки -->
  <button class="ui-btn-primary" (click)="save()">Зберегти</button>
  <button class="ui-btn-secondary">Скасувати</button>
  <button class="ui-btn-danger ui-btn-sm">Видалити</button>

  <!-- Checkbox -->
  <label class="ui-checkbox">
    <input type="checkbox" />
    <span>Активний</span>
  </label>

  <!-- Toggle -->
  <label class="ui-toggle">
    <input type="checkbox" />
    <span></span>
  </label>

  <!-- Badges -->
  <span class="ui-badge-success">ACTIVE</span>
  <span class="ui-badge-neutral">USER</span>

</div>
