<main class="flex-1 flex flex-col items-center justify-center px-6 py-24 text-center">
  <!-- 404 display -->
  <div class="relative mb-8">
    <span class="text-[140px] sm:text-[180px] font-bold text-gray-800 leading-none select-none"> 404 </span>
    <span class="material-icons absolute inset-0 flex items-center justify-center text-gray-700 text-7xl pointer-events-none">
      search_off
    </span>
  </div>

  <!-- Message -->
  <h1 class="text-2xl font-semibold text-white mb-3">Page not found</h1>
  <p class="text-gray-500 text-sm max-w-sm leading-relaxed mb-10">
    The page you are looking for does not exist or has been moved. Check the URL or head back to a known location.
  </p>

  <!-- Actions -->
  <div class="flex items-center gap-3">
    <a
      routerLink="/"
      class="inline-flex items-center gap-2 bg-gray-800 hover:bg-gray-700 text-white text-sm font-medium px-5 py-2.5 rounded-lg transition-colors"
    >
      <span class="material-icons text-base">home</span>
      Home
    </a>
    <a
      routerLink="/login"
      class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium px-5 py-2.5 rounded-lg transition-colors"
    >
      <span class="material-icons text-base">login</span>
      Sign in
    </a>
  </div>
</main>
